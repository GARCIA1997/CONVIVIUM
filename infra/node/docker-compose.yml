# Nodo local de sucursal (mini-PC preinstalado por CONVIVIUM).
# Sirve API (modo edge) + las 4 PWA en la red WiFi del restaurante: https://convivium.local
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: convivium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: convivium
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    image: ghcr.io/convivium/api:${VERSION:-latest}
    restart: always
    environment:
      CONVIVIUM_MODE: edge
      PORT: 4000
      DATABASE_URL: postgres://convivium:${POSTGRES_PASSWORD}@postgres:5432/convivium
      JWT_SECRET: ${JWT_SECRET}
      CLOUD_URL: ${CLOUD_URL}
      BRANCH_ID: ${BRANCH_ID}
    depends_on: [postgres]
  caddy:
    image: caddy:2-alpine
    restart: always
    network_mode: host
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
volumes:
  pgdata:
  caddy_data:
