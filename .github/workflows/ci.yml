name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: convivium
          POSTGRES_PASSWORD: convivium
          POSTGRES_DB: convivium
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U convivium" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get install -y postgresql-client
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # Las 4 PWA (mesero, estación, caja, admin) deben compilar: tsc + vite build
      - run: pnpm -r build
      # domain: reglas puras · api: integración contra Postgres real (bases desechables)
      - run: pnpm -r test
